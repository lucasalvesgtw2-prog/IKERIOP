services:
  postgres:
    image: postgres:16-alpine
    container_name: middleman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-middleman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-middleman}
      POSTGRES_DB: ${POSTGRES_DB:-middleman}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on localhost only so the database is never reachable from the
      # network the host is on.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-middleman}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: middleman-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
    container_name: middleman-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the services are addressed by name; these
      # override whatever localhost URLs the .env file uses for bare-metal runs.
      DATABASE_URL: postgresql://${POSTGRES_USER:-middleman}:${POSTGRES_PASSWORD:-middleman}@postgres:5432/${POSTGRES_DB:-middleman}?schema=public
      REDIS_URL: redis://redis:6379
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres-data:
  redis-data:
